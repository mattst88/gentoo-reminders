[general]
# Local checkout of the gentoo ebuild repository
gentoo_repo = "/home/user/gentoo"

# Where generated .eml files are written
output_dir = "~/.local/share/gentoo-reminders/outbox"

# Where the history of Gentoo's CI reports is kept between runs
cache_dir = "~/.cache/gentoo-reminders"

from_address = "noreply@gentoo.org"
subject_prefix = "[Gentoo Reminder]"

# Whether to add an HTML alternative to the plain text
multipart = true

# Run with -t -oi by --send-outbox
sendmail = "/usr/sbin/sendmail"

[github]
# Repository whose open pull requests are listed, read with the gh CLI
repo = "gentoo/gentoo"

[bugzilla]
# Required by the bugs and new_bugs collectors. Without one, Bugzilla hides
# the domains of email addresses.
api_key = ""
