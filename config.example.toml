[general]
# Clone of the gentoo ebuild repository, which can be bare. Without it, one
# is made in cache_dir.
#gentoo_repo = "/home/user/gentoo.git"

# Where generated .eml files are written
output_dir = "~/.local/share/gentoodo/outbox"

# Where the clone of gentoo.git and the history of Gentoo's CI reports are kept
# between runs
cache_dir = "~/.cache/gentoodo"

from_address = "noreply@gentoo.org"

# Copy every email to this address, for example a mailing list
#cc = "reminders@example.org"

subject_prefix = "[Gentoo Reminder]"

# Whether to add an HTML alternative to the plain text
multipart = true

# Run with -t -oi by --send-outbox
sendmail = "/usr/sbin/sendmail"

[github]
# Repository whose open pull requests are listed, read with the gh CLI
repo = "gentoo/gentoo"

# File with a token for gh. Without it, gh uses its own login.
#secret_file = "~/.config/gentoodo/gh-token"

[bugzilla]
# File with an API key, required by the bugs and new_bugs collectors. Without
# one, Bugzilla hides the domains of email addresses.
#secret_file = "~/.config/gentoodo/bugzilla-api-key"
