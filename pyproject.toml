[build-system]
requires = ["flit_core>=3.11"]
build-backend = "flit_core.buildapi"

[project]
name = "gentoodo"
dynamic = ["version"]
description = "Generate reminder emails for Gentoo package maintainers"
authors = [{name = "Matt Turner", email = "mattst88@gentoo.org"}]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    "pkgcheck",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gentoodo = "gentoodo.cli:main"
